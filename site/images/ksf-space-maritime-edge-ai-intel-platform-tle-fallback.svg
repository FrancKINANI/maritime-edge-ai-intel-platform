<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2744;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fallback1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fallback2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="graceful" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="output" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowY" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#fbbf24"/>
    </marker>
    <marker id="arrowG" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#34d399"/>
    </marker>
    <marker id="arrowR" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="url(#bg4)" rx="12"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">TLE Data Source Fallback Chain</text>
  <text x="500" y="64" text-anchor="middle" fill="#94a3b8" font-size="12">satellite-monitor service (:8004) — Graceful degradation strategy</text>

  <!-- ===== REQUEST FLOW ===== -->
  <!-- Step 1: Request -->
  <rect x="50" y="120" width="150" height="100" rx="10" fill="url(#primary)" filter="url(#shadow3)"/>
  <text x="125" y="152" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Request</text>
  <text x="125" y="170" text-anchor="middle" fill="#ddd6fe" font-size="11">GET /tle/{norad_id}</text>
  <text x="125" y="188" text-anchor="middle" fill="#c4b5fd" font-size="10">or GET /position</text>
  <text x="125" y="208" text-anchor="middle" fill="#a78bfa" font-size="9">NORAD ID: 39634</text>

  <!-- Arrow -->
  <line x1="200" y1="170" x2="248" y2="170" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowY)"/>

  <!-- Step 2: Cache Check -->
  <rect x="250" y="120" width="160" height="100" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="330" y="152" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Cache Check</text>
  <text x="330" y="170" text-anchor="middle" fill="#94a3b8" font-size="11">Redis / In-memory</text>
  <text x="330" y="188" text-anchor="middle" fill="#94a3b8" font-size="11">TTL: 24 hours</text>
  <text x="330" y="208" text-anchor="middle" fill="#64748b" font-size="9">key: tle:{norad_id}</text>

  <!-- Branch: Cache HIT → Output -->
  <line x1="330" y1="220" x2="330" y2="300" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="345" y="265" fill="#34d399" font-size="10" font-weight="bold">HIT</text>
  <rect x="270" y="300" width="120" height="60" rx="8" fill="url(#graceful)" filter="url(#shadow3)"/>
  <text x="330" y="326" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Return Cached</text>
  <text x="330" y="344" text-anchor="middle" fill="#a7f3d0" font-size="10">tle_fresh: false</text>

  <!-- Arrow from cache check to output -->
  <line x1="330" y1="360" x2="820" y2="360" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>

  <!-- Branch: Cache MISS → SatNOGS -->
  <line x1="410" y1="170" x2="468" y2="170" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowY)"/>
  <text x="439" y="162" fill="#f87171" font-size="10" font-weight="bold">MISS</text>

  <!-- Step 3: SatNOGS -->
  <rect x="470" y="120" width="160" height="100" rx="10" fill="url(#primary)" filter="url(#shadow3)"/>
  <text x="550" y="148" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">SatNOGS DB</text>
  <text x="550" y="166" text-anchor="middle" fill="#ddd6fe" font-size="11">Primary Source</text>
  <text x="550" y="184" text-anchor="middle" fill="#c4b5fd" font-size="10">db.satnogs.org/api</text>
  <text x="550" y="202" text-anchor="middle" fill="#a78bfa" font-size="9">Free · Open · Community</text>

  <!-- Arrow: SatNOGS success → Cache + Output -->
  <line x1="550" y1="220" x2="550" y2="300" stroke="#34d399" stroke-width="2"/>
  <text x="565" y="265" fill="#34d399" font-size="10" font-weight="bold">200 OK</text>
  <rect x="490" y="300" width="120" height="60" rx="8" fill="url(#output)" filter="url(#shadow3)"/>
  <text x="550" y="326" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Cache &amp; Return</text>
  <text x="550" y="344" text-anchor="middle" fill="#fde68a" font-size="10">tle_source: satnogs</text>

  <line x1="550" y1="360" x2="820" y2="360" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowY)"/>

  <!-- Arrow: SatNOGS fail → Celestrak -->
  <line x1="630" y1="170" x2="688" y2="170" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowY)"/>
  <text x="659" y="162" fill="#f87171" font-size="10" font-weight="bold">FAIL</text>

  <!-- Step 4: Celestrak -->
  <rect x="690" y="120" width="160" height="100" rx="10" fill="url(#fallback1)" filter="url(#shadow3)"/>
  <text x="770" y="148" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Celestrak</text>
  <text x="770" y="166" text-anchor="middle" fill="#bfdbfe" font-size="11">Fallback Source</text>
  <text x="770" y="184" text-anchor="middle" fill="#93c5fd" font-size="10">celestrak.org/shape</text>
  <text x="770" y="202" text-anchor="middle" fill="#60a5fa" font-size="9">NASA · High Reliability</text>

  <!-- Arrow: Celestrak success → Cache + Output -->
  <line x1="770" y1="220" x2="770" y2="300" stroke="#34d399" stroke-width="2"/>
  <text x="785" y="265" fill="#34d399" font-size="10" font-weight="bold">200 OK</text>
  <rect x="710" y="300" width="120" height="60" rx="8" fill="url(#output)" filter="url(#shadow3)"/>
  <text x="770" y="326" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Cache &amp; Return</text>
  <text x="770" y="344" text-anchor="middle" fill="#fde68a" font-size="10">tle_source: celestrak</text>

  <line x1="770" y1="360" x2="820" y2="360" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowY)"/>

  <!-- Arrow: Celestrak fail → Stale Cache -->
  <line x1="850" y1="170" x2="898" y2="170" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="874" y="162" fill="#f87171" font-size="10" font-weight="bold">FAIL</text>

  <!-- Step 5: Stale Cache -->
  <rect x="900" y="120" width="80" height="100" rx="10" fill="url(#graceful)" filter="url(#shadow3)"/>
  <text x="940" y="152" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Stale</text>
  <text x="940" y="168" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Cache</text>
  <text x="940" y="188" text-anchor="middle" fill="#a7f3d0" font-size="9">Expiry</text>
  <text x="940" y="202" text-anchor="middle" fill="#a7f3d0" font-size="9">relaxed</text>

  <line x1="940" y1="220" x2="940" y2="300" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="890" y="300" width="100" height="60" rx="8" fill="url(#graceful)" filter="url(#shadow3)"/>
  <text x="940" y="326" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Return</text>
  <text x="940" y="344" text-anchor="middle" fill="#a7f3d0" font-size="10">tle_fresh: false</text>

  <line x1="940" y1="360" x2="840" y2="360" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>

  <!-- ===== FINAL OUTPUT ===== -->
  <rect x="820" y="390" width="160" height="70" rx="10" fill="url(#output)" filter="url(#shadow3)"/>
  <text x="900" y="418" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">SGP4 Position</text>
  <text x="900" y="436" text-anchor="middle" fill="#fde68a" font-size="11">lat · lon · altitude</text>
  <text x="900" y="452" text-anchor="middle" fill="#fcd34d" font-size="10">computed from TLE</text>

  <line x1="820" y1="425" x2="780" y2="425" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowY)"/>

  <!-- ===== COMMON NORAD IDs ===== -->
  <rect x="50" y="410" width="500" height="70" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="60" y="434" fill="#94a3b8" font-size="11" font-weight="bold">Common NORAD IDs:</text>
  <text x="60" y="454" fill="#e2e8f0" font-size="11">Sentinel-1A: <tspan fill="#a78bfa" font-weight="bold">39634</tspan></text>
  <text x="230" y="454" fill="#e2e8f0" font-size="11">Sentinel-1B: <tspan fill="#a78bfa" font-weight="bold">41456</tspan></text>
  <text x="400" y="454" fill="#e2e8f0" font-size="11">ISS: <tspan fill="#a78bfa" font-weight="bold">25544</tspan></text>
  <text x="60" y="472" fill="#94a3b8" font-size="10">Satellite position computed via SGP4 propagator with Two-Line Element sets</text>

  <!-- ===== LEGEND ===== -->
  <rect x="580" y="410" width="400" height="70" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="590" y="434" fill="#94a3b8" font-size="11" font-weight="bold">Legend:</text>
  <rect x="650" y="422" width="14" height="14" rx="3" fill="url(#primary)"/>
  <text x="672" y="434" fill="#cbd5e1" font-size="10">Primary Source</text>
  <rect x="770" y="422" width="14" height="14" rx="3" fill="url(#fallback1)"/>
  <text x="792" y="434" fill="#cbd5e1" font-size="10">Fallback Source</text>
  <rect x="900" y="422" width="14" height="14" rx="3" fill="url(#graceful)"/>
  <text x="922" y="434" fill="#cbd5e1" font-size="10">Graceful Degradation</text>
  <text x="590" y="468" fill="#64748b" font-size="10">All paths return valid TLE data — degradation ensures availability even during API outages</text>

  <!-- Footer -->
  <text x="500" y="495" text-anchor="middle" fill="#64748b" font-size="10">KSF Space Foundation · Maritime Edge AI Intelligence Platform v2.1.0</text>
</svg>