<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2744;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="600" fill="url(#bg5)" rx="12"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">Preprocessing Pipelines — A through E</text>
  <text x="550" y="64" text-anchor="middle" fill="#94a3b8" font-size="12">5 stages of increasing sophistication for Sentinel-1 SAR data</text>

  <!-- ===== INPUT ===== -->
  <rect x="30" y="100" width="120" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow4)"/>
  <text x="90" y="130" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Input</text>
  <text x="90" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">Sentinel-1</text>
  <text x="90" y="162" text-anchor="middle" fill="#94a3b8" font-size="10">IW GRDH .SAFE</text>

  <!-- Arrow from input -->
  <line x1="150" y1="140" x2="170" y2="140" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== PIPELINE A: Raw ===== -->
  <rect x="170" y="90" width="170" height="120" rx="10" fill="url(#pipeA)" filter="url(#shadow4)"/>
  <text x="255" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">A — Raw</text>
  <line x1="190" y1="128" x2="320" y2="128" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="255" y="148" text-anchor="middle" fill="#e5e7eb" font-size="11">Baseline pipeline</text>
  <text x="255" y="166" text-anchor="middle" fill="#d1d5db" font-size="10">• Normalize to [0,1]</text>
  <text x="255" y="182" text-anchor="middle" fill="#d1d5db" font-size="10">• No calibration</text>
  <text x="255" y="198" text-anchor="middle" fill="#d1d5db" font-size="10">• No filtering</text>

  <!-- Arrow A output -->
  <line x1="255" y1="210" x2="255" y2="250" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="205" y="252" width="100" height="35" rx="6" fill="#1e293b" stroke="#4b5563" stroke-width="1"/>
  <text x="255" y="274" text-anchor="middle" fill="#d1d5db" font-size="10">Raw .npy</text>

  <!-- ===== PIPELINE B: Sigma0 ===== -->
  <rect x="360" y="90" width="170" height="120" rx="10" fill="url(#pipeB)" filter="url(#shadow4)"/>
  <text x="445" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">B — Sigma0</text>
  <line x1="380" y1="128" x2="510" y2="128" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="445" y="148" text-anchor="middle" fill="#bfdbfe" font-size="11">Radiometric calibration</text>
  <text x="445" y="166" text-anchor="middle" fill="#93c5fd" font-size="10">• DN → σ₀ (backscatter)</text>
  <text x="445" y="182" text-anchor="middle" fill="#93c5fd" font-size="10">• Remove antenna pattern</text>
  <text x="445" y="198" text-anchor="middle" fill="#93c5fd" font-size="10">• Area scaling factor</text>

  <!-- Arrow B output -->
  <line x1="445" y1="210" x2="445" y2="250" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="395" y="252" width="100" height="35" rx="6" fill="#1e293b" stroke="#1d4ed8" stroke-width="1"/>
  <text x="445" y="274" text-anchor="middle" fill="#93c5fd" font-size="10">Sigma0 .npy</text>

  <!-- ===== PIPELINE C: Sigma0 + Lee ===== -->
  <rect x="550" y="90" width="170" height="120" rx="10" fill="url(#pipeC)" filter="url(#shadow4)"/>
  <text x="635" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">C — Sigma0+Lee</text>
  <line x1="570" y1="128" x2="700" y2="128" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="635" y="148" text-anchor="middle" fill="#ddd6fe" font-size="11">Calibration + filtering</text>
  <text x="635" y="166" text-anchor="middle" fill="#c4b5fd" font-size="10">• Pipeline B + Lee filter</text>
  <text x="635" y="182" text-anchor="middle" fill="#c4b5fd" font-size="10">• Adaptive speckle reduction</text>
  <text x="635" y="198" text-anchor="middle" fill="#c4b5fd" font-size="10">• Preserves edges</text>

  <!-- Arrow C output -->
  <line x1="635" y1="210" x2="635" y2="250" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="585" y="252" width="100" height="35" rx="6" fill="#1e293b" stroke="#6d28d9" stroke-width="1"/>
  <text x="635" y="274" text-anchor="middle" fill="#c4b5fd" font-size="10">Lee .npy</text>

  <!-- ===== PIPELINE D: Full Chain ===== -->
  <rect x="740" y="90" width="170" height="120" rx="10" fill="url(#pipeD)" filter="url(#shadow4)"/>
  <text x="825" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">D — Full Chain</text>
  <line x1="760" y1="128" x2="890" y2="128" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="825" y="148" text-anchor="middle" fill="#a5f3fc" font-size="11">Complete calibration chain</text>
  <text x="825" y="166" text-anchor="middle" fill="#67e8f9" font-size="10">• Pipeline C + log dB</text>
  <text x="825" y="182" text-anchor="middle" fill="#67e8f9" font-size="10">• 10·log₁₀(σ₀) compression</text>
  <text x="825" y="198" text-anchor="middle" fill="#67e8f9" font-size="10">• Scientific validation</text>

  <!-- Arrow D output -->
  <line x1="825" y1="210" x2="825" y2="250" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="775" y="252" width="100" height="35" rx="6" fill="#1e293b" stroke="#0e7490" stroke-width="1"/>
  <text x="825" y="274" text-anchor="middle" fill="#67e8f9" font-size="10">dB .npy</text>

  <!-- ===== PIPELINE E: MVSSD Enhanced ===== -->
  <rect x="930" y="90" width="150" height="120" rx="10" fill="url(#pipeE)" filter="url(#shadow4)"/>
  <text x="1005" y="118" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">E — MVSSD</text>
  <line x1="950" y1="128" x2="1060" y2="128" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="1005" y="148" text-anchor="middle" fill="#fecaca" font-size="11">Enhanced pipeline</text>
  <text x="1005" y="166" text-anchor="middle" fill="#fca5a5" font-size="10">• Pipeline D + CLAHE</text>
  <text x="1005" y="182" text-anchor="middle" fill="#fca5a5" font-size="10">• Gaussian blur</text>
  <text x="1005" y="198" text-anchor="middle" fill="#fca5a5" font-size="10">• Median blur</text>

  <!-- Arrow E output -->
  <line x1="1005" y1="210" x2="1005" y2="250" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="955" y="252" width="100" height="35" rx="6" fill="#1e293b" stroke="#b91c1c" stroke-width="1"/>
  <text x="1005" y="274" text-anchor="middle" fill="#fca5a5" font-size="10">MVSSD .npy</text>

  <!-- ===== DETECTOR (shared downstream) ===== -->
  <rect x="430" y="320" width="240" height="70" rx="10" fill="#0891b2" filter="url(#shadow4)"/>
  <text x="550" y="350" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">YOLOv8 INT8 ONNX Detector</text>
  <text x="550" y="370" text-anchor="middle" fill="#a5f3fc" font-size="11">NMS → Bounding Boxes → Priority</text>

  <!-- Arrows from all pipelines to detector -->
  <line x1="255" y1="287" x2="460" y2="318" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="445" y1="287" x2="490" y2="318" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="635" y1="287" x2="550" y2="318" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="825" y1="287" x2="610" y2="318" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1005" y1="287" x2="640" y2="318" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== COMPARISON TABLE ===== -->
  <rect x="30" y="420" width="1040" height="160" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>

  <!-- Table header -->
  <text x="550" y="448" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Pipeline Feature Comparison</text>

  <!-- Column headers -->
  <text x="120" y="472" text-anchor="middle" fill="#94a3b8" font-size="11">Feature</text>
  <text x="310" y="472" text-anchor="middle" fill="#9ca3af" font-size="11" font-weight="bold">A</text>
  <text x="460" y="472" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">B</text>
  <text x="610" y="472" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">C</text>
  <text x="760" y="472" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="bold">D</text>
  <text x="910" y="472" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">E</text>

  <line x1="50" y1="480" x2="1060" y2="480" stroke="#334155" stroke-width="1"/>

  <!-- Row 1: Radiometric Calibration -->
  <text x="120" y="500" text-anchor="middle" fill="#e2e8f0" font-size="11">Radiometric Calibration</text>
  <text x="310" y="500" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="460" y="500" text-anchor="middle" fill="#34d399" font-size="14">✓</text>
  <text x="610" y="500" text-anchor="middle" fill="#34d399" font-size="14">✓</text>
  <text x="760" y="500" text-anchor="middle" fill="#34d399" font-size="14">✓</text>
  <text x="910" y="500" text-anchor="middle" fill="#34d399" font-size="14">✓</text>

  <!-- Row 2: Lee Speckle Filter -->
  <text x="120" y="520" text-anchor="middle" fill="#e2e8f0" font-size="11">Lee Speckle Filter</text>
  <text x="310" y="520" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="460" y="520" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="610" y="520" text-anchor="middle" fill="#34d399" font-size="14">✓</text>
  <text x="760" y="520" text-anchor="middle" fill="#34d399" font-size="14">✓</text>
  <text x="910" y="520" text-anchor="middle" fill="#34d399" font-size="14">✓</text>

  <!-- Row 3: Log dB Conversion -->
  <text x="120" y="540" text-anchor="middle" fill="#e2e8f0" font-size="11">Log dB Conversion</text>
  <text x="310" y="540" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="460" y="540" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="610" y="540" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="760" y="540" text-anchor="middle" fill="#34d399" font-size="14">✓</text>
  <text x="910" y="540" text-anchor="middle" fill="#34d399" font-size="14">✓</text>

  <!-- Row 4: CLAHE Enhancement -->
  <text x="120" y="560" text-anchor="middle" fill="#e2e8f0" font-size="11">CLAHE Enhancement</text>
  <text x="310" y="560" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="460" y="560" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="610" y="560" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="760" y="560" text-anchor="middle" fill="#f87171" font-size="14">✗</text>
  <text x="910" y="560" text-anchor="middle" fill="#34d399" font-size="14">✓</text>

  <!-- Footer -->
  <text x="550" y="595" text-anchor="middle" fill="#64748b" font-size="10">KSF Space Foundation · Maritime Edge AI Intelligence Platform v2.1.0</text>
</svg>