<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2744;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowW" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#e2e8f0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">Data Flow — End-to-End Pipeline</text>
  <text x="600" y="64" text-anchor="middle" fill="#94a3b8" font-size="12">Sentinel-1 SAR Imagery → Vessel Detection → Operator Dashboard</text>

  <!-- ===== STEP 1: INGEST ===== -->
  <rect x="30" y="110" width="160" height="140" rx="12" fill="url(#step1)" filter="url(#shadow2)"/>
  <circle cx="110" cy="140" r="18" fill="#fff" fill-opacity="0.15"/>
  <text x="110" y="146" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">1</text>
  <text x="110" y="174" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">INGEST</text>
  <text x="110" y="192" text-anchor="middle" fill="#ddd6fe" font-size="10">data-ingestor</text>
  <text x="110" y="210" text-anchor="middle" fill="#c4b5fd" font-size="10">:8001</text>
  <line x1="55" y1="222" x2="165" y2="222" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="110" y="238" text-anchor="middle" fill="#e9d5ff" font-size="9">CDSE catalogue</text>
  <text x="110" y="250" text-anchor="middle" fill="#e9d5ff" font-size="9">search &amp; download</text>

  <!-- Arrow 1→2 -->
  <line x1="190" y1="180" x2="230" y2="180" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="210" y="172" text-anchor="middle" fill="#94a3b8" font-size="9">.SAFE</text>

  <!-- ===== STEP 2: PREPROCESS ===== -->
  <rect x="235" y="110" width="160" height="140" rx="12" fill="url(#step2)" filter="url(#shadow2)"/>
  <circle cx="315" cy="140" r="18" fill="#fff" fill-opacity="0.15"/>
  <text x="315" y="146" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">2</text>
  <text x="315" y="174" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">PREPROCESS</text>
  <text x="315" y="192" text-anchor="middle" fill="#bfdbfe" font-size="10">sentinel-preprocessor</text>
  <text x="315" y="210" text-anchor="middle" fill="#93c5fd" font-size="10">:8000</text>
  <line x1="260" y1="222" x2="370" y2="222" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="315" y="238" text-anchor="middle" fill="#dbeafe" font-size="9">Calibrate · Filter · dB</text>
  <text x="315" y="250" text-anchor="middle" fill="#dbeafe" font-size="9">Tile · Georeference</text>

  <!-- Arrow 2→3 -->
  <line x1="395" y1="180" x2="435" y2="180" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="415" y="172" text-anchor="middle" fill="#94a3b8" font-size="9">512×512 .npy</text>

  <!-- ===== STEP 3: DETECT ===== -->
  <rect x="440" y="110" width="160" height="140" rx="12" fill="url(#step3)" filter="url(#shadow2)"/>
  <circle cx="520" cy="140" r="18" fill="#fff" fill-opacity="0.15"/>
  <text x="520" y="146" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">3</text>
  <text x="520" y="174" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">DETECT</text>
  <text x="520" y="192" text-anchor="middle" fill="#a5f3fc" font-size="10">detector</text>
  <text x="520" y="210" text-anchor="middle" fill="#67e8f9" font-size="10">:8003</text>
  <line x1="465" y1="222" x2="575" y2="222" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="520" y="238" text-anchor="middle" fill="#cffafe" font-size="9">YOLOv8 INT8 ONNX</text>
  <text x="520" y="250" text-anchor="middle" fill="#cffafe" font-size="9">NMS · Bounding Boxes</text>

  <!-- Arrow 3→4 -->
  <line x1="600" y1="180" x2="640" y2="180" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="620" y="172" text-anchor="middle" fill="#94a3b8" font-size="9">DetectionEvent</text>

  <!-- ===== STEP 4: ENRICH ===== -->
  <rect x="645" y="110" width="160" height="140" rx="12" fill="url(#step4)" filter="url(#shadow2)"/>
  <circle cx="725" cy="140" r="18" fill="#fff" fill-opacity="0.15"/>
  <text x="725" y="146" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">4</text>
  <text x="725" y="174" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">ENRICH</text>
  <text x="725" y="192" text-anchor="middle" fill="#a7f3d0" font-size="10">aggregator</text>
  <text x="725" y="210" text-anchor="middle" fill="#6ee7b7" font-size="10">:8002</text>
  <line x1="670" y1="222" x2="780" y2="222" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="725" y="238" text-anchor="middle" fill="#d1fae5" font-size="9">Zone · AIS · Priority</text>
  <text x="725" y="250" text-anchor="middle" fill="#d1fae5" font-size="9">SQLite persistence</text>

  <!-- Arrow 4→5 -->
  <line x1="805" y1="180" x2="845" y2="180" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="825" y="172" text-anchor="middle" fill="#94a3b8" font-size="9">enriched event</text>

  <!-- ===== STEP 5: DISPLAY ===== -->
  <rect x="850" y="110" width="160" height="140" rx="12" fill="url(#step5)" filter="url(#shadow2)"/>
  <circle cx="930" cy="140" r="18" fill="#fff" fill-opacity="0.15"/>
  <text x="930" y="146" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">5</text>
  <text x="930" y="174" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">DISPLAY</text>
  <text x="930" y="192" text-anchor="middle" fill="#fde68a" font-size="10">ground-dashboard</text>
  <text x="930" y="210" text-anchor="middle" fill="#fcd34d" font-size="10">:8501 · Streamlit</text>
  <line x1="875" y1="222" x2="985" y2="222" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="930" y="238" text-anchor="middle" fill="#fef3c7" font-size="9">3 Operational Modes</text>
  <text x="930" y="250" text-anchor="middle" fill="#fef3c7" font-size="9">JSON + UI rendering</text>

  <!-- Arrow 5→6 -->
  <line x1="1010" y1="180" x2="1050" y2="180" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="1030" y="172" text-anchor="middle" fill="#94a3b8" font-size="9">report</text>

  <!-- ===== STEP 6: ACT ===== -->
  <rect x="1055" y="110" width="120" height="140" rx="12" fill="url(#step6)" filter="url(#shadow2)"/>
  <circle cx="1115" cy="140" r="18" fill="#fff" fill-opacity="0.15"/>
  <text x="1115" y="146" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">6</text>
  <text x="1115" y="174" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">ACT</text>
  <line x1="1075" y1="190" x2="1155" y2="190" stroke="#fff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="1115" y="208" text-anchor="middle" fill="#fecaca" font-size="10">Operator</text>
  <text x="1115" y="222" text-anchor="middle" fill="#fecaca" font-size="10">Decision</text>
  <text x="1115" y="240" text-anchor="middle" fill="#fca5a5" font-size="9">Interdiction</text>

  <!-- ===== DETAILED DATA PRODUCTS (Bottom section) ===== -->
  <rect x="30" y="300" width="1140" height="270" rx="10" fill="#0f172a" fill-opacity="0.6"/>

  <!-- Section title -->
  <text x="600" y="330" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Data Products at Each Stage</text>

  <!-- Stage 1 products -->
  <rect x="50" y="350" width="160" height="200" rx="8" fill="#1e1b4b" fill-opacity="0.8"/>
  <text x="130" y="374" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">Stage 1 — Ingest</text>
  <text x="60" y="398" fill="#c4b5fd" font-size="10">• Sentinel-1 IW GRDH</text>
  <text x="60" y="416" fill="#c4b5fd" font-size="10">• .SAFE format archive</text>
  <text x="60" y="434" fill="#c4b5fd" font-size="10">• ~2 GB per scene</text>
  <text x="60" y="452" fill="#c4b5fd" font-size="10">• Bbox + date range</text>
  <text x="60" y="470" fill="#c4b5fd" font-size="10">• Metadata JSON</text>
  <text x="60" y="498" fill="#7c3aed" font-size="9" font-style="italic">Products endpoint:</text>
  <text x="60" y="514" fill="#a78bfa" font-size="9">GET /products?bbox=...</text>

  <!-- Stage 2 products -->
  <rect x="230" y="350" width="180" height="200" rx="8" fill="#172554" fill-opacity="0.8"/>
  <text x="320" y="374" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">Stage 2 — Preprocess</text>
  <text x="240" y="398" fill="#93c5fd" font-size="10">• 512×512 .npy tiles</text>
  <text x="240" y="416" fill="#93c5fd" font-size="10">• Radiometric calibration</text>
  <text x="240" y="434" fill="#93c5fd" font-size="10">• Lee speckle filter</text>
  <text x="240" y="452" fill="#93c5fd" font-size="10">• dB conversion</text>
  <text x="240" y="470" fill="#93c5fd" font-size="10">• GCP georeferencing</text>
  <text x="240" y="488" fill="#93c5fd" font-size="10">• MVSSD enhancement</text>
  <text x="240" y="516" fill="#2563eb" font-size="9" font-style="italic">5 Pipelines:</text>
  <text x="240" y="532" fill="#60a5fa" font-size="9">A B C D E</text>

  <!-- Stage 3 products -->
  <rect x="430" y="350" width="180" height="200" rx="8" fill="#0c4a6e" fill-opacity="0.8"/>
  <text x="520" y="374" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="bold">Stage 3 — Detect</text>
  <text x="440" y="398" fill="#67e8f9" font-size="10">• DetectionEvent JSON</text>
  <text x="440" y="416" fill="#67e8f9" font-size="10">• Bounding boxes (x1,y1,x2,y2)</text>
  <text x="440" y="434" fill="#67e8f9" font-size="10">• Confidence scores</text>
  <text x="440" y="452" fill="#67e8f9" font-size="10">• Vessel count</text>
  <text x="440" y="470" fill="#67e8f9" font-size="10">• Processing time (ms)</text>
  <text x="440" y="488" fill="#67e8f9" font-size="10">• Scene + tile IDs</text>
  <text x="440" y="516" fill="#0891b2" font-size="9" font-style="italic">Model:</text>
  <text x="440" y="532" fill="#22d3ee" font-size="9">yolov8n_mrssd_int8.onnx</text>

  <!-- Stage 4 products -->
  <rect x="630" y="350" width="180" height="200" rx="8" fill="#064e3b" fill-opacity="0.8"/>
  <text x="720" y="374" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">Stage 4 — Enrich</text>
  <text x="640" y="398" fill="#6ee7b7" font-size="10">• Zone: Z1 / Z2 / Z3</text>
  <text x="640" y="416" fill="#6ee7b7" font-size="10">• AIS match (GFW)</text>
  <text x="640" y="434" fill="#6ee7b7" font-size="10">• Dark vessel flag</text>
  <text x="640" y="452" fill="#6ee7b7" font-size="10">• Priority level</text>
  <text x="640" y="470" fill="#6ee7b7" font-size="10">• Satellite position</text>
  <text x="640" y="488" fill="#6ee7b7" font-size="10">• Persisted to SQLite</text>
  <text x="640" y="516" fill="#059669" font-size="9" font-style="italic">Priority heuristic:</text>
  <text x="640" y="532" fill="#34d399" font-size="9">LOW MEDIUM HIGH CRITICAL</text>

  <!-- Stage 5 products -->
  <rect x="830" y="350" width="180" height="200" rx="8" fill="#78350f" fill-opacity="0.8"/>
  <text x="920" y="374" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">Stage 5 — Display</text>
  <text x="840" y="398" fill="#fcd34d" font-size="10">• JSON payloads</text>
  <text x="840" y="416" fill="#fcd34d" font-size="10">• Interactive tables</text>
  <text x="840" y="434" fill="#fcd34d" font-size="10">• Zone breakdown</text>
  <text x="840" y="452" fill="#fcd34d" font-size="10">• Priority stats</text>
  <text x="840" y="470" fill="#fcd34d" font-size="10">• Event timeline</text>
  <text x="840" y="488" fill="#fcd34d" font-size="10">• File upload UI</text>
  <text x="840" y="516" fill="#d97706" font-size="9" font-style="italic">3 modes:</text>
  <text x="840" y="532" fill="#fbbf24" font-size="9">Upload · Query · Monitor</text>

  <!-- Stage 6 box -->
  <rect x="1030" y="350" width="120" height="200" rx="8" fill="#7f1d1d" fill-opacity="0.8"/>
  <text x="1090" y="374" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">Stage 6</text>
  <text x="1090" y="398" text-anchor="middle" fill="#fca5a5" font-size="10">Operator</text>
  <text x="1090" y="416" text-anchor="middle" fill="#fca5a5" font-size="10">Action</text>
  <line x1="1050" y1="430" x2="1130" y2="430" stroke="#fff" stroke-opacity="0.15" stroke-width="1"/>
  <text x="1090" y="450" text-anchor="middle" fill="#fca5a5" font-size="9">• Interdict</text>
  <text x="1090" y="468" text-anchor="middle" fill="#fca5a5" font-size="9">• Investigate</text>
  <text x="1090" y="486" text-anchor="middle" fill="#fca5a5" font-size="9">• Report</text>
  <text x="1090" y="504" text-anchor="middle" fill="#fca5a5" font-size="9">• Archive</text>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#64748b" font-size="10">KSF Space Foundation · Maritime Edge AI Intelligence Platform v2.1.0</text>
</svg>