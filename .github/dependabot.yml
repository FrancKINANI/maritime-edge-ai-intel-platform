version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "onnxruntime"
        versions: ["<1.24"]

  - package-ecosystem: "docker"
    directory: "/docker/base"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    # NOTE: `versioning-strategy` only supports `auto` for github-actions
    # (any other value fails configuration validation). To prevent major
    # bumps that previously broke CI (checkout@v4 -> v7), ignore semver-major
    # updates for the actions that must stay on a tested major version.
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-python"
        update-types: ["version-update:semver-major"]
